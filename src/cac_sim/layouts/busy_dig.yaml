# STRESS LAYOUT: busy_dig
# Run: generate_arena --layout busy_dig --out /tmp/arenas
#
# What it stresses: the dig -> berm haul with obstacles. The obstacle zone is an ordinary field
# (taken from random seed 1, so it is as hard as any random arena). The excavation zone holds the
# MAXIMUM the limits allow: 4 boulders and 3 craters (arena.yaml boulders/craters in_excavation_zone),
# placed around the assumed dig spot (6.6, 1.4) and the haul route (randomiser.routes.haul:
# (6.6, 1.4) -> (7.4, 2.4) -> (7.8, 3.3)).
# Why: the rules only forbid obstacles in the start and construction zones, so the judges can pack the
# digging area. The robot must pick a dig spot that is free of craters (a crater changes the sand
# depth and the volume of a scoop), then drive loaded with sand, slowly, between boulders and craters
# to the berm target box.
# Clear space kept around the dig spot (6.6, 1.4): no obstacle centre within 0.84 m and no obstacle edge within 0.67 m of it, so a
# legal dig spot exists. A round robot (the same width as the rover) can drive from the dig spot
# to the berm target (tested).
# A good robot: rejects dig spots near a crater rim, replans the haul route when a crater shows up
# late, and does not drop sand into a crater.
# Start pose: (1.0, 1.0), yaw 0 deg = facing east.
#
# Strict check: passes with no issues.
