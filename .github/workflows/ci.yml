name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Keep downloaded .deb packages between runs: Gazebo and Nav2 are large and the apt
      # mirrors are slow. The ROS image deletes archives after install, so turn that off first.
      - name: keep apt downloads
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: apt cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-jazzy-${{ hashFiles('src/**/package.xml') }}
          restore-keys: apt-${{ runner.os }}-jazzy-

      - name: rosdep install
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: colcon test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
